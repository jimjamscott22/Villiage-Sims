<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 880 380"><rect width="880" height="380" fill="#17211b" rx="16"/><text x="28" y="40" fill="#f7f4e9" font-size="20" font-weight="700">Three stacked canvases, redrawn at different rates</text><text x="28" y="62" fill="#a8b5aa" font-size="13">Terrain is pre-rendered once to an offscreen buffer and blitted; only what moves is redrawn each frame.</text><g><g><g transform="translate(120,110) matrix(1,0,-0.5,0.7,0,0) translate(0,300)"><rect width="300" height="200" fill="#3f7fbf"/><rect width="240" height="200" x="60" y="0" fill="#588a42"/><rect width="100" height="90" x="200" y="0" fill="#3a6b34"/><rect width="90" height="50" x="0" y="150" fill="#e2cd8f"/><g stroke="#0d140f" stroke-opacity=".25"><line x1="0" x2="300" y1="50" y2="50"/><line x1="0" x2="300" y1="100" y2="100"/><line x1="0" x2="300" y1="150" y2="150"/><line x1="75" x2="75" y1="0" y2="200"/><line x1="150" x2="150" y1="0" y2="200"/><line x1="225" x2="225" y1="0" y2="200"/></g></g><g transform="translate(120,110) matrix(1,0,-0.5,0.7,0,0) translate(0,150)"><rect width="300" height="200" fill="#f7f4e9" fill-opacity=".04" stroke="#3a4d36"/><rect width="60" height="60" x="90" y="70" fill="#a9713f" stroke="#6d431f" stroke-width="2"/><rect width="40" height="40" x="180" y="40" fill="#b7b0a0" stroke="#6f6a5c" stroke-width="2"/><circle cx="70" cy="120" r="10" fill="#e8a33d" stroke="#5a3a1e" stroke-width="2"/><circle cx="210" cy="140" r="10" fill="#d96a3a" stroke="#5a3a1e" stroke-width="2"/></g><g transform="translate(120,110) matrix(1,0,-0.5,0.7,0,0) translate(0,0)"><rect width="300" height="200" fill="#5aa0d0" fill-opacity=".05" stroke="#5aa0d0" stroke-opacity=".5"/><rect width="90" height="90" x="120" y="60" fill="#8fce4f" fill-opacity=".35" stroke="#8fce4f" stroke-width="2"/><rect width="30" height="30" x="120" y="60" fill="none" stroke="#8fce4f" stroke-width="1.5"/></g></g></g><g font-size="13"><g transform="translate(560,120)"><rect width="290" height="52" fill="#1e2a2f" stroke="#5aa0d0" rx="8"/><text x="14" y="22" fill="#5aa0d0" font-weight="700">Overlay</text><text x="14" y="40" fill="#a8b5aa" font-size="11">build ghost · selection · hover — every frame in build mode</text></g><g transform="translate(560,192)"><rect width="290" height="52" fill="#22301f" stroke="#e8a33d" rx="8"/><text x="14" y="22" fill="#e8a33d" font-weight="700">Entities</text><text x="14" y="40" fill="#a8b5aa" font-size="11">buildings · crops · villagers — redrawn every frame</text></g><g transform="translate(560,264)"><rect width="290" height="52" fill="#22301f" stroke="#588a42" rx="8"/><text x="14" y="22" fill="#8fce4f" font-weight="700">Terrain</text><text x="14" y="40" fill="#a8b5aa" font-size="11">tiles — drawn on load, patched only on dirty tiles</text></g></g><g stroke="#3a4d36" stroke-dasharray="3 3"><line x1="470" x2="558" y1="130" y2="146"/><line x1="470" x2="558" y1="210" y2="218"/><line x1="470" x2="558" y1="290" y2="290"/></g></svg>