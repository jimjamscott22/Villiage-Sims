name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 links against system webkit/gtk, so `cargo check` needs these
      # even though CI never builds the bundled desktop app.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        id: setup
        with:
          workspaces: src-tauri

      # Each check runs even when an earlier check failed, so one lint error
      # cannot hide the test results — the job still fails if any of them do.
      # Gating on `steps.setup` means a failure in setup (toolchain, system
      # deps) skips the checks instead of burying the real cause under
      # cascading errors; an earlier setup failure skips `setup` itself, so its
      # outcome stops being `success` and the gate holds. Test runs before
      # Clippy to put the most valuable signal first in the log.
      - name: Test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  web:
    name: Web (test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        id: setup

      # Same reasoning as the Rust job: a failing test suite should not hide
      # whether the build still compiles. `npm ci` is setup rather than a
      # check, so a failure there skips both.
      - name: Test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run build
